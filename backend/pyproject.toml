[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scopesense-backend"
version = "0.1.0"
authors = [
    {name = "Scope Sense Team", email = "team@scopesense.com"}
]
description = "Backend API for Scope Sense - contract and scope governance platform"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4,<1.8",
    "bcrypt>=4.0.1,<5.0.0",
    "python-multipart>=0.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.alembic]
path = "alembic"

dir = "src/app/db/migrations"
alembic_ini_config = "alembic.ini"

[tool.uvicorn]
host = "0.0.0.0"
port = 8000

[tool.ruff]
select = ["E", "F", "W", "I"]
ignore = []
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
line-length = 100